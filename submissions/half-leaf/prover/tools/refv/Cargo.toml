# R1: the lvm6 reference verifier (a development oracle, never shipped): FORMAT6.md checked byte for byte, the
# arithmetic of leanVM's `crates/verifier` (fdb317982) patched to the v6 transcript, and a KAT generator.
[package]
name = "refv"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "refv"
path = "src/main.rs"

# R2: §6.2 alone (the tree batch prefix of `lvm6-prover tree6`), its stack claims checked natively.
[[bin]]
name = "refv-tree"
path = "src/tree_main.rs"

[lints]
workspace = true

[dependencies]
verifier.workspace = true
keccak256.workspace = true
fs6 = { path = "../../crates/fs6" }
parallel = { package = "experimental_parallel", path = "../../crates/parallel" }
primitives = { package = "experimental_primitives", path = "../../crates/primitives" }
pcs = { package = "experimental_pcs", path = "../../crates/pcs" }
# §6.3–§6.4 (moved from R3's dev verifiers): layout, the sponge's blocks and rows, the typed circuit and STUB `Q`,
# the mini-bus tables and grinds. Data and circuit only: these crates no longer depend on refv.
r3core = { path = "../../crates/r3core" }
r3sponge = { path = "../../crates/r3sponge" }
r3typed = { path = "../../crates/r3typed" }
r3mb = { path = "../../crates/r3mb" }

[features]
# R9: verify the shape `P17` (`fs6::params::SHAPE`).
p17 = ["fs6/p17"]

[dev-dependencies]
# R3's round-trip tests (moved here with the §6.3–§6.4 verifiers) drive the v6 `ProverState`.
fiat_shamir = { package = "fiat_shamir_prover", path = "../../crates/fiat_shamir_prover" }
